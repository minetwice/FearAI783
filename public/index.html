<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FearAI - Advanced Mobile AI Assistant</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6d28d9">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-container">
      <div class="brand-logo">F</div>
      <span class="brand-name">FearAI</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="voiceToggleBtn" title="Voice Response">
        <i class="fas fa-volume-up"></i>
      </button>
      <button class="icon-btn" id="clearChatBtn" title="Clear Chat">
        <i class="fas fa-trash-alt"></i>
      </button>
    </div>
  </header>

  <!-- Persona Selection Bar -->
  <div class="persona-bar">
    <button class="persona-chip active" data-persona="minecraft">
      <i class="fas fa-cube"></i> Minecraft Developer
    </button>
    <button class="persona-chip" data-persona="coding">
      <i class="fas fa-code"></i> Master Coder
    </button>
    <button class="persona-chip" data-persona="reasoning">
      <i class="fas fa-brain"></i> Deep Thinker
    </button>
    <button class="persona-chip" data-persona="research">
      <i class="fas fa-globe"></i> Web Research
    </button>
    <button class="persona-chip" data-persona="friendly">
      <i class="fas fa-comments"></i> Friendly AI
    </button>
  </div>

  <!-- Main Chat Container -->
  <main class="chat-container" id="chatContainer">
    <!-- Welcome Card -->
    <div class="message-wrapper ai">
      <div class="message-bubble">
        👋 <strong>Welcome to FearAI!</strong><br><br>
        I am your personal AI assistant powered by the <strong>Qwen Coder Open-Source AI Model</strong>! No API key or payment required.<br><br>
        Built for <strong>Minecraft plugins/mods (Java, Bedrock, Fabric/Forge)</strong>, <strong>complex coding in all languages</strong>, <strong>deep reasoning</strong>, and <strong>web research</strong>.
      </div>
    </div>
  </main>

  <!-- Input Area -->
  <footer class="input-area">
    <div class="input-options">
      <label class="toggle-container">
        <input type="checkbox" id="searchToggle">
        <span><i class="fas fa-search"></i> Enable Live Web Research</span>
      </label>
      <span style="margin-left: auto;" id="activeProviderLabel">Engine: Qwen Open-Source</span>
    </div>
    <div class="input-box-wrapper">
      <button class="icon-btn" id="micBtn" title="Voice Input">
        <i class="fas fa-microphone"></i>
      </button>
      <input type="text" id="userInput" class="chat-input" placeholder="Ask FearAI or request Minecraft code..." autocomplete="off">
      <button class="send-btn" id="sendBtn" title="Send">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </footer>

  <script src="/js/system-prompts.js"></script>
  <script src="/js/fearai-engine.js"></script>
  <script src="/app.js"></script>
</body>
</html>
